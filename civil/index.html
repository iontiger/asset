<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>덴포토 문명 · DentPhoto Civilization</title><meta name="description" content="DentPhoto 마을에서 시작하는 턴제 문명 게임">
<link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="map3d" aria-label="문명 지도"></canvas>
<div id="labels"></div>

<header class="topbar">
  <div class="brand"><span class="mark">D<i>✿</i></span><span>덴포토 문명<small>DENTPHOTO CIVILIZATION</small></span></div>
  <div class="stats">
    <span class="stat" id="stTurn" title="턴">⏳ <b>1</b></span>
    <span class="stat" id="stGold" title="금 (목표자산 20억 = 금 2,000)">💰 <b>0</b><small></small></span>
    <button class="stat research" id="stSci" title="연구 (T)">🔬 <b>연구 고르기</b><small></small><i class="bar"><u></u></i></button>
    <span class="stat goal" id="stGoal" title="목표자산 승리: 자산 경영 기술 + 금 2,000(=20억)">🏆 <b>0억</b><small>/ 20억</small><i class="bar"><u></u></i></span>
  </div>
  <div class="tools">
    <button id="btTech" title="기술 (T)">🔬</button><button id="btDiplo" title="외교">🤝</button><button id="btHelp" title="도움말 (H)">?</button><button id="btMenu" title="메뉴">☰</button><button id="btHome" title="마을로 돌아가기">✕</button>
  </div>
</header>

<div id="notes" aria-live="polite"></div>
<div id="tip" hidden></div>

<aside id="unitPanel" class="panel" hidden></aside>
<aside id="cityPanel" class="sheet" hidden></aside>

<div class="corner">
  <canvas id="mini" width="200" height="132" title="작은 지도 — 눌러서 이동"></canvas>
  <button id="btNext" class="next">턴 종료</button>
  <button id="btEnd" class="end-anyway" hidden>그냥 턴 끝내기 ⏎</button>
</div>

<div id="modal" class="modal" hidden><div class="card" role="dialog" aria-modal="true"></div></div>

<section id="start" class="start">
  <div class="start-card">
    <span class="eyebrow">THE SECRET OF DENTPHOTO VILLAGE</span>
    <h1>덴포토 문명</h1>
    <p class="lead">작은 마을 하나에서 시작해 도시를 세우고, 기술을 연구하고, 이웃 문명과 겨루며<br><b>목표자산 20억</b>을 향해 나아가세요.</p>
    <div class="pick-title">문명 고르기</div>
    <div id="civPick" class="civ-pick"></div>
    <div class="opts">
      <label>지도 크기 <select id="optSize"><option value="small">작게 · 3문명</option><option value="normal" selected>보통 · 4문명</option><option value="large">크게 · 5문명</option></select></label>
      <label>난이도 <select id="optDiff"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></label>
    </div>
    <button id="btNew" class="primary">새 게임 시작 <span>→</span></button>
    <button id="btContinue" class="ghost" hidden>이어하기</button>
    <small class="wins">승리 조건 · 🏰 정복(모든 문명의 첫 수도 차지) · 🏆 목표자산(자산 경영 + 금 2,000 = 20억) · ⭐ 점수(250턴)</small>
  </div>
</section>

<script src="../3d/ride/vendor/three.min.js"></script>
<script src="../3d/ride/village-landmarks.js"></script>
<script src="civ-rules.js"></script>
<script src="civ-view.js"></script>
<script src="civ-game.js"></script>
</body></html>
