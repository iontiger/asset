<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>덴포토 치과 경쟁 · DentPhoto Clinic Wars</title><meta name="description" content="덴포토 치과가 덤핑치과 · 불법위임치과 · 365치과와 겨루는 턴제 전략 게임">
<link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="map3d" aria-label="상권 지도"></canvas>
<div id="labels"></div>

<header class="topbar">
  <div class="brand"><span class="mark">D<i>✿</i></span><span>덴포토 치과 경쟁<small>DENTPHOTO CLINIC WARS</small></span></div>
  <div class="stats">
    <span class="stat" id="stTurn" title="턴">⏳ <b>1</b></span>
    <span class="stat" id="stGold" title="매출 (목표자산 20억 = 매출 2,000)">💰 <b>0</b><small></small></span>
    <button class="stat research" id="stSci" title="연구 (T)">🔬 <b>연구 고르기</b><small></small><i class="bar"><u></u></i></button>
    <span class="stat goal" id="stGoal" title="목표자산 승리: 자산 경영 연구 + 매출 2,000(=20억)">🏆 <b>0억</b><small>/ 20억</small><i class="bar"><u></u></i></span>
  </div>
  <div class="tools">
    <button id="btTech" title="치의학 연구 (T)">🔬</button><button id="btDiplo" title="경쟁 치과">🤝</button><button id="btHelp" title="도움말 (H)">?</button><button id="btMenu" title="메뉴">☰</button><button id="btHome" title="마을로 돌아가기">✕</button>
  </div>
</header>

<div id="notes" aria-live="polite"></div>
<div id="tip" hidden></div>

<aside id="unitPanel" class="panel" hidden></aside>
<aside id="cityPanel" class="sheet" hidden></aside>

<div class="corner">
  <canvas id="mini" width="200" height="132" title="작은 지도 — 눌러서 이동"></canvas>
  <button id="btNext" class="next">턴 종료</button>
  <button id="btEnd" class="end-anyway" hidden>그냥 턴 끝내기 ⏎</button>
</div>

<div id="modal" class="modal" hidden><div class="card" role="dialog" aria-modal="true"></div></div>

<section id="start" class="start">
  <div class="start-card">
    <span class="eyebrow">THE SECRET OF DENTPHOTO VILLAGE</span>
    <h1>덴포토 치과 경쟁</h1>
    <p class="lead">동네에 덴포토 치과를 열고 지점을 늘리고, 치의학을 연구하고, 경쟁 치과와 환자를 두고 겨루며<br><b>목표자산 20억</b>을 향해 나아가세요.</p>
    <div class="pick-title">이번 상권의 치과들</div>
    <div id="civPick" class="civ-pick"></div>
    <div class="opts">
      <label>지도 크기 <select id="optSize"><option value="small">작게 · 경쟁 치과 2곳</option><option value="normal" selected>보통 · 경쟁 치과 3곳</option><option value="large">크게 · 경쟁 치과 4곳</option></select></label>
      <label>난이도 <select id="optDiff"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></label>
    </div>
    <button id="btNew" class="primary">새 게임 시작 <span>→</span></button>
    <button id="btContinue" class="ghost" hidden>이어하기</button>
    <small class="wins">승리 조건 · 🏥 인수 합병(경쟁 치과 본점 모두 인수) · 🏆 목표자산(자산 경영 + 매출 2,000 = 20억) · ⭐ 평판 점수(250턴)</small>
  </div>
</section>

<script src="../3d/ride/vendor/three.min.js"></script>
<script src="../3d/ride/village-landmarks.js"></script>
<script src="civ-rules.js"></script>
<script src="civ-view.js"></script>
<script src="civ-game.js"></script>
</body></html>
