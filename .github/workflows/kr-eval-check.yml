# 국내주식 평가 스크립트(.github/scripts/kr_eval.py)를 고친 PR 에서 실제로 받아 보고 요약을 찍는다.
# 이 컨테이너 밖(GitHub 러너)에서 돌리는 이유: 네이버 · NH Plug 를 받을 수 있어서.
name: KR stock eval check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/kr_eval.py
      - .github/workflows/kr-eval-check.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ETF 응답 모양 보기
        run: |
          python3 - <<'PY'
          import urllib.request
          UA = {"User-Agent": "Mozilla/5.0"}
          for u in ["https://m.stock.naver.com/api/stock/069500/integration",
                    "https://m.stock.naver.com/api/stock/360750/integration",
                    "https://m.stock.naver.com/api/stock/069500/basic",
                    "https://m.stock.naver.com/api/stock/069500/etfAnalysis",
                    "https://m.stock.naver.com/api/stock/069500/finance/annual"]:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=20).read().decode()
                  print("=====", u, len(b)); print(b[:4000])
              except Exception as e:
                  print("=====", u, "ERR", e)
          import sys; sys.path.insert(0, ".github/scripts")
          from stoch_screen import FIELDS, RECORD, MST_URL, get
          buf = get(MST_URL, 60); seen = {}
          for i in range(0, len(buf) - len(buf) % RECORD, RECORD):
              rec, off, r = buf[i:i + RECORD], 0, {}
              for name, n in FIELDS:
                  r[name] = rec[off:off + n].decode("cp949", "replace").strip(); off += n
              k = (r["sMarket"], r["gVenture"])
              seen.setdefault(k, []).append(r["sCode"] + " " + r["sKorName"])
          for k, v in sorted(seen.items()): print(k, len(v), v[:4])
          PY
      - name: 전 종목 평가해 보기
        run: |
          python3 .github/scripts/kr_eval.py out
          ls out/s | wc -l
          du -sh out
          python3 -c "import json; d=json.load(open('out/s/005930.json')); d.pop('bars'); print(json.dumps(d, ensure_ascii=False)[:5000])"
      - uses: actions/upload-artifact@v4
        with:
          name: kr-eval
          path: out/index.json
          retention-days: 7
