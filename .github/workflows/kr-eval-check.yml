# 국내주식 평가 스크립트(.github/scripts/kr_eval.py)를 고친 PR 에서 실제로 받아 보고 요약을 찍는다.
# 이 컨테이너 밖(GitHub 러너)에서 돌리는 이유: 네이버 · NH Plug 를 받을 수 있어서.
name: KR stock eval check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/kr_eval.py
      - .github/workflows/kr-eval-check.yml

permissions:
  contents: read

jobs:
  upjong:
    runs-on: ubuntu-latest
    steps:
      - name: 업종 자료 모양 보기
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=20) as r:
                  return r.status, r.read()
          for u in ["https://finance.naver.com/sise/sise_group.naver?type=upjong",
                    "https://m.stock.naver.com/api/stocks/industry?page=1&pageSize=5",
                    "https://m.stock.naver.com/api/stocks/industry/278?page=1&pageSize=2",
                    "https://m.stock.naver.com/api/stock/005930/integration"]:
              try:
                  st, b = get(u)
                  t = b.decode("euc-kr" if "finance.naver" in u else "utf-8", "replace")
                  print("==", u, st, len(t))
                  i = t.find("upjong")
                  print(t[max(0, i - 300):i + 600] if "finance.naver" in u else t[:1500])
                  if "integration" in u:
                      d = json.loads(t); print({k: (v if not isinstance(v, (list, dict)) else type(v).__name__) for k, v in d.items()})
              except Exception as e:
                  print("==", u, "ERR", e)
          PY
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 전 종목 평가해 보기
        run: |
          python3 .github/scripts/kr_eval.py out
          ls out/s | wc -l
          du -sh out
          python3 -c "import json; [print(json.dumps({k: v for k, v in json.load(open(f'out/s/{c}.json')).items() if k != 'bars'}, ensure_ascii=False)[:3000]) for c in ('005930', '069500', '122630')]"
          python3 -c "import json; [print(c, {k: json.load(open(f'out/s/{c}.json')).get(k) for k in ('grp', 'sig', 'hist')}) for c in ('005930', '000660', '035420', '069500', '360750', '153130', '122630')]"
      - uses: actions/upload-artifact@v4
        with:
          name: kr-eval
          path: out/index.json
          retention-days: 7
