# 포트폴리오 시세 스크립트(.github/scripts/portfolio.py)를 고친 PR 에서 실제로 받아 보고 요약을 찍는다.
# 이 컨테이너 밖(GitHub 러너)에서 돌리는 이유: 야후 · stooq 시세를 받을 수 있어서.
name: Portfolio price check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/scripts/portfolio.py
      - .github/workflows/portfolio-check.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 시세 받아 보기
        run: |
          python3 .github/scripts/portfolio.py out
          ls -la out
          python3 -c "import json; d=json.load(open('out/portfolio.json')); print(d['rows'][:2], d['rows'][-2:])"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio
          path: out/
          retention-days: 7
