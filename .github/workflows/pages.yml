# index.html · 아이콘 · logos/ 이미지를 GitHub Pages에 올리고 logos.json 목록을 만든다.
# → https://iontiger.github.io/asset/
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 기본 브랜치에 올라온 것만 배포한다
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp index.html icon-192.png icon-512.png apple-touch-icon.png _site/
          # logos/ 의 이미지를 올리고, 로고 선택 창이 읽을 logos.json 목록을 자동으로 만든다
          mkdir -p _site/logos
          if [ -d logos ]; then
            find logos -maxdepth 1 -type f -iregex '.*\.\(png\|jpe?g\|gif\|webp\|svg\)' -exec cp {} _site/logos/ \;
          fi
          ( cd _site/logos && ls -1 | LC_ALL=C sort ) | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()], ensure_ascii=False))' > _site/logos.json
          echo "logos.json:"; cat _site/logos.json
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
