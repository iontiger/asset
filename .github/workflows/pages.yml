# index.html · 아이콘 · logos/ 이미지를 GitHub Pages에 올리고 logos.json 목록을 만든다.
# 매시 정각 무렵에는 네이버페이 증권 AI 시황 브리핑의 최신 글을 briefing.json 으로 받아 둔다 (휴대폰 투자 탭의 카드 뉴스).
# 연금 정기투자 기록용 ETF 10:30 가격은 rb1030/ 으로 (.github/scripts/etf_1030.py).
# 스토캐스틱 매수/매도 신호 종목은 stoch.json 으로 (휴대폰 투자 탭 신호 카드 · PC 투자 정보 화면과 차트용 일봉, .github/scripts/stoch_screen.py).
# → https://iontiger.github.io/asset/
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # 매시 3분 · 23분 · 43분 (UTC 로 적지만 한국 시간도 같은 분). GitHub 은 정각(0분)에 실행이 몰려 크게 늦거나
    # 아예 건너뛰기 쉬워서(GitHub 도 다른 분을 권함) 정각 바로 뒤에 돌고, 20분마다 한 번 더 확인한다.
    # 글이 새로 올라왔을 때만 다시 배포한다 (그대로면 건너뜀)
    - cron: '3,23,43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# 기능 브랜치에 올린 것(배포 안 함)이 기본 브랜치 배포를 취소하지 않도록 브랜치마다 따로 줄을 세운다
concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # 기본 브랜치에 올라온 것만 배포한다 (예약 실행은 늘 기본 브랜치에서 돈다)
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.briefing.outputs.deploy == 'true' || steps.stoch.outputs.changed == 'true' || steps.rbcache.outputs.cache-hit != 'true' || steps.rb1030.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5

      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest app-icon-192.png app-icon-512.png app-icon-180.png _site/
          # 자산마을 3D 미니게임판 (자산 금액 없이 마을만) → https://iontiger.github.io/asset/3d/
          mkdir -p _site/3d && cp 3d/index.html _site/3d/
          # 실사 화질용 사진 무늬 · 하늘빛 (3d/assets/real, 출처는 CREDITS.md)
          cp -r 3d/assets _site/3d/
          # 우체국에서 여는 우편배달 게임 '바람을 따라' (Three.js, 따로 된 페이지) → /asset/3d/ride/
          mkdir -p _site/3d/ride && cp 3d/ride/*.html 3d/ride/*.js 3d/ride/*.css 3d/ride/*.mp3 _site/3d/ride/ && cp -r 3d/ride/vendor _site/3d/ride/
          # 마을 '문명 전당'에서 여는 턴제 문명 게임 '덴포토 문명' (3d/ride 의 three.min.js · 마을 모델을 같이 씀) → /asset/civil/
          mkdir -p _site/civil && cp civil/*.html civil/*.js civil/*.css _site/civil/ && rm -f _site/civil/*.cjs
          # 게임 페이지의 js · css 주소에 커밋 번호를 붙여, 브라우저가 옛 파일(예: 옛 game.js)과 새 index.html 을 섞어 쓰지 않게 한다
          for f in _site/3d/ride/index.html _site/civil/index.html; do sed -i -E "s#(src|href)=\"([A-Za-z0-9_-]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" "$f"; grep -oE '(src|href)="[^"]+\?v=[^"]+"' "$f" | head -3; done
          # 버전 표시 · 새 버전 알림용 — 커밋 번호와 커밋 시각(한국 시간).
          # 브리핑만 바꿔 다시 올려도 같은 커밋이면 값이 같아서 "새 버전" 알림이 뜨지 않는다
          BUILD="${GITHUB_SHA::7} $(TZ=Asia/Seoul git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M')"
          sed -i "s|content=\"__BUILD__\"|content=\"$BUILD\"|" _site/index.html
          grep -o 'name="app-build" content="[^"]*"' _site/index.html
          # logos/ 의 이미지를 올리고, 로고 선택 창이 읽을 logos.json 목록을 자동으로 만든다
          mkdir -p _site/logos
          if [ -d logos ]; then
            find logos -maxdepth 1 -type f -iregex '.*\.\(png\|jpe?g\|gif\|webp\|svg\)' -exec cp {} _site/logos/ \;
          fi
          ( cd _site/logos && ls -1 | LC_ALL=C sort ) | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()], ensure_ascii=False))' > _site/logos.json
          echo "logos.json:"; cat _site/logos.json
          ls -la _site

      # 네이버에서 못 받으면 지금 사이트의 briefing.json 을 그대로 쓴다 — 배포는 멈추지 않는다
      - name: AI 시황 브리핑 받기
        id: briefing
        run: python3 .github/scripts/briefing.py _site/briefing.json "${{ steps.pages.outputs.base_url }}" "${{ github.event_name }}" "${GITHUB_SHA::7}"

      # 휴대폰 투자 탭의 스토캐스틱 신호 카드 — 전 영업일 종가 기준 매수/매도 신호 종목 (시가총액 순 5개씩).
      # 하루 두 번(08시 KST 전/후)만 새로 뽑고, 그 사이에는 사이트의 stoch.json 을 그대로 쓴다. 못 뽑아도 배포는 멈추지 않는다
      - name: 스토캐스틱 신호 받기
        id: stoch
        run: python3 .github/scripts/stoch_screen.py _site --site "${{ steps.pages.outputs.base_url }}"

      # PC 연금 리밸런싱 종목 차트(캔들 · 스토캐스틱)용 ETF · ETN 일봉 → _site/rbbars/{code}.json.
      # 1,500여 종목이라 하루 두 번(08시 KST 전/후)만 새로 받고, 그 사이에는 Actions 캐시를 그대로 쓴다
      - name: ETF 일봉 캐시 키
        id: rbkey
        run: echo "key=rbbars-$(TZ=Asia/Seoul date +%Y%m%d)-$([ "$(TZ=Asia/Seoul date +%H)" -ge 8 ] && echo am || echo early)" >> "$GITHUB_OUTPUT"
      - name: ETF 일봉 캐시
        id: rbcache
        uses: actions/cache@v4
        with:
          path: rbbars
          key: ${{ steps.rbkey.outputs.key }}
          restore-keys: rbbars-
      - name: ETF 일봉 받기
        if: steps.rbcache.outputs.cache-hit != 'true'
        run: python3 .github/scripts/etf_bars.py rbbars
      - name: ETF 일봉 사이트에 넣기
        run: mkdir -p rbbars && cp -r rbbars _site/rbbars && ls _site/rbbars | wc -l

      # 연금 정기투자용 ETF · ETN 10:30 가격 → _site/rb1030/{ymd}.json (+ index.json, 최근 30거래일).
      # 평일 10:31 이후 첫 실행에서 오늘 것을 받고, 지난 날짜는 지금 사이트의 파일을 그대로 이어 쓴다
      - name: ETF 10:30 가격 받기
        id: rb1030
        run: python3 .github/scripts/etf_1030.py _site/rb1030 "${{ steps.pages.outputs.base_url }}"

      - if: steps.briefing.outputs.deploy == 'true' || steps.stoch.outputs.changed == 'true' || steps.rbcache.outputs.cache-hit != 'true' || steps.rb1030.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
