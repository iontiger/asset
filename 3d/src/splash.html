<script>
/* 스플래시: 모든 스크립트를 읽고(load) 첫 화면이 두 번 그려지면 시작하기를 보인다. 누르면 4월 맑은 아침으로 맞추고 주인공 고르기로 */
(()=>{const sp=document.getElementById('splash');let ready=false;
function show(){if(ready||!sp.isConnected)return;ready=true;sp.classList.remove('loading');sp.classList.add('ready');const b=document.getElementById('splashStart');b&&b.focus()}
function start(){if(!ready)return;try{window.dpSeason&&dpSeason.startBright()}catch(e){console.error(e)}sp.classList.add('out');const hp=document.getElementById('heroPick');if(hp){hp.inert=false;setTimeout(()=>{const b=hp.querySelector('[data-hero="'+(window.dpHero||'me')+'"]');b&&b.focus()},30)}setTimeout(()=>sp.remove(),700)}
document.getElementById('splashStart').addEventListener('click',start);
// 스플래시가 떠 있는 동안 게임 키는 막는다 (밑에 깔린 주인공 고르기가 Enter 로 눌리지 않게) — 시작하기 버튼의 Enter · Space 만 둔다
addEventListener('keydown',e=>{if(!sp.isConnected||sp.classList.contains('out'))return;if(e.key==='Tab'||(e.target&&e.target.id==='splashStart'&&(e.key==='Enter'||e.key===' ')))return;e.preventDefault();e.stopImmediatePropagation()},true);
addEventListener('load',()=>{const hp=document.getElementById('heroPick');if(hp&&!sp.classList.contains('out'))hp.inert=true;requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(show,120)))});
setTimeout(()=>{if(document.readyState==='complete')show()},20000);   // 그림 하나가 끝내 안 와도 20초 뒤에는 시작할 수 있게
window.dpSplash={show,start};
})();
</script>
